services:
  db:
    image: postgres:16-alpine
    container_name: saas-dashboard-postgres
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
      POSTGRES_DB: dashboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas-dashboard-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://dashboard:dashboard@db:5432/dashboard
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
